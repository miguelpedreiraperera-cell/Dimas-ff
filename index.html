<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dimas FF</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#02050d;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 10%,rgba(0,140,255,.18),transparent 35%),
    radial-gradient(circle at 10% 80%,rgba(0,70,255,.10),transparent 30%);
  z-index:-1;
}

.app{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 5%,#06447e 0,#050b18 30%,#02040a 75%);
}

/* HEADER */

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #078cff55;
  background:#020711cc;
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-size:29px;
  font-weight:900;
  letter-spacing:4px;
  color:#fff;
  text-shadow:
    0 0 8px #00aaff,
    0 0 20px #008cff,
    0 0 40px #006cff;
  animation:brandGlow 2.5s infinite alternate;
}

@keyframes brandGlow{
  from{
    text-shadow:
      0 0 8px #00aaff,
      0 0 20px #008cff;
  }
  to{
    text-shadow:
      0 0 12px #00d9ff,
      0 0 30px #008cff,
      0 0 55px #006cff;
  }
}

.menu{
  position:absolute;
  left:14px;
  top:16px;
  width:46px;
  height:40px;
  border:1px solid #08f;
  border-radius:12px;
  background:#061426;
  color:#fff;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 0 12px #08f4;
}

.menu:hover{
  box-shadow:0 0 20px #08f;
  transform:scale(1.04);
}

/* MENU */

nav{
  position:fixed;
  z-index:30;
  left:0;
  top:0;
  width:275px;
  height:100%;
  padding:85px 16px 20px;
  background:#030914f7;
  backdrop-filter:blur(14px);
  transform:translateX(-110%);
  transition:.25s;
  border-right:1px solid #08f;
  box-shadow:10px 0 35px #08f2;
}

nav.open{
  transform:translateX(0);
}

nav button{
  width:100%;
  padding:15px;
  margin:7px 0;
  background:#07172d;
  color:#fff;
  border:1px solid #087cff;
  border-radius:12px;
  text-align:left;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

nav button:hover{
  background:#09284e;
  box-shadow:0 0 15px #087cff88;
  transform:translateX(4px);
}

/* MAIN */

main{
  max-width:900px;
  width:94%;
  margin:auto;
}

.screen{
  display:none;
  animation:screenIn .25s ease;
}

.screen.active{
  display:block;
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* HOME */

.hero{
  text-align:center;
  padding:55px 10px 30px;
}

.hero h1{
  font-size:clamp(45px,13vw,88px);
  margin:0;
  color:#fff;
  text-shadow:
    0 0 12px #00aaff,
    0 0 35px #0066ff,
    0 0 70px #004cff;
}

.hero p{
  color:#b7dcff;
  font-size:14px;
  letter-spacing:1px;
}

.cards{
  display:grid;
  gap:16px;
}

.card{
  width:100%;
  display:flex;
  align-items:center;
  gap:18px;
  padding:21px;
  border:1px solid #08f;
  border-radius:18px;
  background:linear-gradient(135deg,#061226,#071b35);
  box-shadow:
    0 0 18px #08f2,
    inset 0 0 20px #08f08;
  color:white;
  cursor:pointer;
  text-align:left;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 28px #08f5,
    inset 0 0 25px #08f12;
}

.icon{
  font-size:42px;
  width:60px;
  text-align:center;
}

.card h2{
  margin:0 0 6px;
}

.card p{
  margin:0;
  color:#00baff;
}

.arrow{
  margin-left:auto;
  font-size:34px;
  color:#00baff;
}

/* BENEFITS */

.benefits{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:22px;
  border:1px solid #086cc4;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 0 18px #087cff22;
}

.benefits div{
  padding:17px 6px;
  text-align:center;
  background:#050c18;
  font-size:12px;
}

.benefits b{
  display:block;
  margin-top:7px;
  color:#b7dcff;
}

/* BUTTONS */

.back{
  margin:24px 0 12px;
  padding:10px 15px;
  border:1px solid #08f;
  border-radius:10px;
  background:#061326;
  color:white;
  cursor:pointer;
}

.back:hover{
  box-shadow:0 0 15px #08f6;
}

.title{
  text-align:center;
  margin:15px 0 22px;
  text-shadow:0 0 15px #08f;
}

/* PRODUCTS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.product{
  position:relative;
  padding:21px;
  border:1px solid #08f;
  border-radius:17px;
  background:
    radial-gradient(circle at 50% 0%,#0b3158,#061226 55%);
  box-shadow:
    0 0 18px #08f2,
    inset 0 0 18px #08f08;
  transition:.22s;
  overflow:hidden;
}

.product:before{
  content:"";
  position:absolute;
  top:-60px;
  left:50%;
  width:120px;
  height:120px;
  transform:translateX(-50%);
  background:#00aaff;
  filter:blur(55px);
  opacity:.18;
  pointer-events:none;
}

.product:hover{
  transform:translateY(-5px);
  border-color:#00c8ff;
  box-shadow:
    0 0 30px #08f5,
    inset 0 0 25px #08f10;
}

.product h3{
  margin:0 0 10px;
  font-size:18px;
}

.diamond-icon{
  font-size:34px;
  margin-bottom:8px;
  display:block;
  filter:drop-shadow(0 0 8px #00baff);
}

.price{
  font-size:25px;
  font-weight:bold;
  color:#00c0ff;
  text-shadow:0 0 10px #008cff;
}

.buy{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:1px solid #00c8ff;
  border-radius:11px;
  background:linear-gradient(90deg,#087cff,#00aaff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
  box-shadow:0 0 15px #087cff55;
  transition:.2s;
}

.buy:hover{
  transform:scale(1.02);
  box-shadow:
    0 0 20px #00aaff,
    0 0 35px #087cff55;
}

.buy:active{
  transform:scale(.98);
}

/* FORMS */

.form{
  max-width:560px;
  margin:auto;
  padding:21px;
  border:1px solid #08f;
  border-radius:16px;
  background:#061226;
  box-shadow:0 0 25px #08f2;
}

label{
  display:block;
  margin:14px 0 6px;
}

  padding:13px;
  border-radius:9px;
  border:
