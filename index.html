<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dimas FF</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #fff;
}

/* ================= HEADER ================= */

header {
    height: 70px;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: rgba(10, 12, 18, 0.95);
    border-bottom: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    color: #00d9ff;
    text-shadow: 0 0 12px #00d9ff;
}

.menu-btn {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

/* ================= MENU ================= */

.sidebar {
    position: fixed;
    top: 0;
    left: -290px;

    width: 280px;
    height: 100vh;

    z-index: 2000;

    padding: 25px;

    background: #10131b;

    transition: .3s;

    box-shadow: 5px 0 30px rgba(0,0,0,.5);
}

.sidebar.active {
    left: 0;
}

.sidebar h2 {
    color: #00d9ff;
    margin-bottom: 35px;
}

.sidebar a {
    display: block;

    padding: 16px 8px;

    color: white;
    text-decoration: none;

    border-bottom: 1px solid rgba(255,255,255,.08);

    transition: .2s;
}

.sidebar a:hover {
    color: #00d9ff;
}

.close-menu {
    position: absolute;
    right: 20px;
    top: 15px;

    font-size: 28px;

    cursor: pointer;
}

.overlay {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.65);

    z-index: 1500;
}

.overlay.active {
    display: block;
}

/* ================= CONTAINER ================= */

.container {
    width: min(1100px, 92%);
    margin: auto;
}

section {
    padding-top: 100px;
}

.title {
    font-size: 27px;
    font-weight: 900;
    margin-bottom: 25px;
}

/* ================= INÍCIO ================= */

.hero {
    min-height: 650px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding-top: 110px;
}

.hero-box {
    width: 100%;
    max-width: 850px;

    padding: 70px 30px;

    border-radius: 25px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,217,255,.16),
            transparent 65%
        );

    border: 1px solid rgba(0,217,255,.25);
}

.hero h1 {
    font-size: clamp(45px, 8vw, 90px);
    font-weight: 1000;

    color: #00d9ff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 30px rgba(0,217,255,.6);
}

.hero p {
    margin-top: 20px;
    color: #bbb;
    font-size: 18px;
}

.hero-btn {
    display: inline-block;

    margin-top: 30px;

    padding: 14px 30px;

    border-radius: 10px;

    background: #00d9ff;
    color: #061016;

    text-decoration: none;

    font-weight: 900;

    box-shadow: 0 0 20px rgba(0,217,255,.45);
}

/* ================= CARDS ================= */

.cards {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.card {
    background: #121620;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 16px;

    padding: 22px;

    transition: .25s;
}

.card:hover {
    transform: translateY(-4px);

    border-color: rgba(0,217,255,.45);

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);
}

/* ================= DIAMANTES ================= */

.diamonds {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.diamond-card {
    text-align: center;

    background: #121620;

    border: 1px solid rgba(0,217,255,.15);

    border-radius: 17px;

    padding: 25px;
}

.diamond {
    font-size: 55px;

    margin-bottom: 15px;

    filter:
        drop-shadow(0 0 12px rgba(0,217,255,.7));
}

.diamond-card h3 {
    font-size: 20px;
}

.amount {
    margin-top: 8px;
    color: #aaa;
}

.price {
    margin: 15px 0;

    font-size: 24px;

    font-weight: 900;

    color: #00d9ff;
}

.buy-btn {
    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    background: #00d9ff;

    color: #061016;

    font-weight: 900;

    transition: .2s;
}

.buy-btn:hover {
    transform: scale(1.03);

    box-shadow:
        0 0 18px rgba(0,217,255,.5);
}

/* ================= CONTAS ================= */

.accounts {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.account-card {
    overflow: hidden;

    background: #121620;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,.08);
}

.account-photo {
    height: 210px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #191d27;

    color: #777;

    font-size: 20px;
}

.account-info {
    padding: 20px;
}

.account-info h3 {
    margin-bottom: 8px;
}

.account-info p {
    color: #999;
}

.account-price {
    margin: 15px 0;

    font-size: 22px;

    font-weight: 900;

    color: #00d9ff;
}

/* ================= COMO FUNCIONA ================= */

.steps {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.step {
    text-align: center;
}
